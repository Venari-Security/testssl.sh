name: Manual Build & Deploy testssl

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter testssl version (Example: 3.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:

  build_deb:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Build .deb using provided script
        run: |
          chmod +x packaging/build-deb.sh

          RAW="${{ github.event.inputs.version }}"

          # Convert dots to hyphens to satisfy your requirement (3.2 → 3-2)
          SAFE_VERSION=$(echo "$RAW" | tr '.' '-')

          echo "Final version: $SAFE_VERSION"

          ./packaging/build-deb.sh "$SAFE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: "testssl_*_amd64.deb"


  push_to_repos:
    name: Push .deb to ALL Venari Aptly repos
    needs: build_deb
    runs-on: ubuntu-latest

    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS_DMS: ${{ secrets.SSH_KNOWN_HOSTS_DMS }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_SERVER: ${{ secrets.SSH_SERVER }}
      CLIENT_OVPN: ${{ secrets.CLIENT_OVPN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb-package

      # Start VPN
      - name: Connect VPN
        run: |
          sudo apt-get update -y && sudo apt-get install -y openvpn
          echo "${CLIENT_OVPN}" | sudo tee /etc/openvpn/client.conf > /dev/null
          echo "log /etc/openvpn/client.log" | sudo tee -a /etc/openvpn/client.conf
          sudo openvpn --config /etc/openvpn/client.conf --daemon
          sleep 30
          sudo tail -n 20 /etc/openvpn/client.log

      # SSH
      - name: Setup SSH
        run: |
          sudo apt-get install -y openssh-client
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-add ~/.ssh/id_rsa
          echo "${SSH_KNOWN_HOSTS_DMS}" > ~/.ssh/known_hosts

      - name: Verify SSH & Aptly
        run: |
          echo "Checking SSH connection..."
          ssh ${SSH_USERNAME}@${SSH_SERVER} "hostname && aptly repo list"
          echo "SSH OK"

      # Upload to ALL repos
      - name: Upload and publish everywhere
        run: |
          DATE=$(date '+%y.%m.%d.%H.%M')
          DEB=$(ls testssl_*_amd64.deb)

          echo "📦 Found package: $DEB"

          for COMPONENT in preprod; do
            echo "=============================="
            echo "➡ Uploading to repo-$COMPONENT/"
            echo "=============================="

            scp "$DEB" ${SSH_USERNAME}@${SSH_SERVER}:repo-$COMPONENT/

            echo "🔄 Updating venarios-$COMPONENT ..."
            ssh ${SSH_USERNAME}@${SSH_SERVER} "
              aptly repo add -force-replace venarios-${COMPONENT} repo-${COMPONENT}/$DEB &&
              aptly snapshot create venarios-${COMPONENT}-${DATE} from repo venarios-${COMPONENT} &&
              aptly publish switch \
                -batch \
                -passphrase='${GPG_PASSPHRASE}' \
                -component='${COMPONENT}' bullseye venarios-${COMPONENT}-${DATE}
            "
          done

          echo "🎉 All repos updated."


      - name: Summary
        run: |
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Pushed to: dev, stg, prod, main"
          echo "Done."
